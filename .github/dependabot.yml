version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # Generated by cargo-dist, whose release plan fails when the file differs from what
    # it would generate. Update it with `dist generate`, not by hand.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
