[package]
name = "stilltrue"
version = "0.1.0"
edition = "2024"
# stilltrue-hook ships beside it; without this, a bare `cargo run` refuses to choose.
default-run = "stilltrue"
description = "A linter that binds claims made in Markdown to the real repository, for CLAUDE.md, AGENTS.md and your README."
license = "MIT"
repository = "https://github.com/uk0064/stilltrue"
homepage = "https://github.com/uk0064/stilltrue"
readme = "README.md"
keywords = ["linter", "documentation", "markdown", "agents", "ci"]
categories = ["command-line-utilities", "development-tools"]
# The fixture repositories are built by build.sh at test time; shipping them would
# roughly double the package for no consumer benefit.
exclude = ["tests/fixtures/**", "tests/snapshots/**", ".github/**", "bench/**"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
toml = "1.1.4"
tree-sitter = "0.26.13"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

# Already in the tree through `dirs`. The hook adapter uses it to run the checker in a
# process group of its own and kill that whole group, so a scan it abandons leaves no
# git process behind.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
